<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão das atividades do Laboratório Industrial</title><style>
:root { --verde:#00983A; --azul:#004881; --navy:#143257; --vermelho:#C0392B; --muted:#6B7785; --fundo:#E9EDF1; --borda:#E0E5EA; }
* { box-sizing:border-box; }

.kpi .label { color:var(--muted); font-size:12px; min-height:30px; }
.kpi .value { color:var(--navy); font-size:21px; font-weight:700; margin-top:6px; }
.kpi.titulo .label { min-height:0; color:#3E3E3E; font-size:13px; font-weight:600; }
.kpi.titulo .value { color:var(--navy); margin-top:0; }
.kpi.ok .value { color:#009A44; }
.kpi.alerta .value { color:var(--vermelho); }
.kpi.neutro .value { color:var(--muted); }
#grafico { width:100%; min-height:455px; }
table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
th { background:var(--navy); color:#fff; text-align:center; padding:9px 8px; position:sticky; top:0; z-index:2; }

}

section {background:#fff;border:1px solid #E0E5EA;border-radius:10px;box-shadow:0 1px 2px rgba(12,34,64,.06);padding:16px;margin:16px 0}

<script>
(()=>{
const root=document.getElementById('lab-three'),get=id=>root.querySelector('#lt-'+id);
let rows=[{"bench": "Etanol", "activity": "Coleta etanol", "minutes": 15.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "°GL vinhaça", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "°GL flegamaça", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "pH etanol", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "Condutividade etanol", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "°Inpm, massa, °GL etanol", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "Acidez etanol", "minutes": 3.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "Análises cromatógraficas em etanol", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "Análise sensorial etanol em etanol", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Etanol", "activity": "Análise de Barbet em etanol", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Cor açúcar NIR", "minutes": 1.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Pol açúcar NIR", "minutes": 1.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Cinzas açúcar NIR", "minutes": 1.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Umidade do açúcar NIR", "minutes": 1.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Insoluvel açúcar NIR", "minutes": 1.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Cor açúcar Conv.", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Pol açúcar Conv.", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Cinzas açúcar Conv.", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Umidade do açúcar Conv.", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Açúcar", "activity": "Insoluvel açúcar Conv.", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "ART mosto Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "Coleta fermentação", "minutes": 15.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "pH do mosto Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "Acidez do mosto Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "ART Mosto NIR", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "pH do mosto NIR", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "Acidez do mosto NIR", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "Proteína levedura Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "pH da levedura Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Fermentação", "activity": "Umidade da levedura Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "Análise de umidade de bagaço Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "Análise de Pol de bagaço Conv.", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "Brix mel/caldo", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "Brix de Pol mel/caldo", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "pH caldo", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "Insoluvel caldo", "minutes": 2.0, "q": [1, 0, 0]}, {"bench": "Caldo", "activity": "coleta de bagaço", "minutes": 15.0, "q": [1, 0, 0]}, {"bench": "Águas", "activity": "Coleta de águas do processo", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Águas", "activity": "Coleta de águas de caldeiras", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Águas", "activity": "Analise de carboidratos em águas", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Águas", "activity": "Analise de DQO", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Águas", "activity": "Análise de DBO", "minutes": 5.0, "q": [1, 0, 0]}, {"bench": "Microbiologia", "activity": "Viabilidade celular", "minutes": 2.0, "q": [0, 1, 0]}, {"bench": "Microbiologia", "activity": "Contaminação bactérias", "minutes": 2.0, "q": [0, 1, 0]}, {"bench": "Microbiologia", "activity": "Plaqueamento", "minutes": 2.0, "q": [0, 1, 0]}, {"bench": "Microbiologia", "activity": "Coleta na fermentação", "minutes": 2.0, "q": [0, 1, 0]}, {"bench": "Microbiologia", "activity": "Coleta na fabrica de levedura", "minutes": 2.0, "q": [0, 1, 0]}];
const turnNames=['A','B','C'];
const shiftTimes=[['00:00','03:00','04:00','07:00'],['07:00','12:00','13:00','16:48'],['15:40','19:00','20:00','23:50']];
const benchNames=['Etanol','Açúcar','Fermentação','Caldo','Águas','Microbiologia'];
const benchKeys={etanol:0,acucar:1,fermentacao:2,caldo:3,caldos:3,agua:4,aguas:4,micro:5,microbiologia:5};
function benchIndex(name){const key=String(name).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return benchKeys[key]??-1;}

const settings=[{"people": 5, "hours": 6.0, "other": 0}, {"people": 6, "hours": 8.8, "other": 0}, {"people": 5, "hours": 7.166666666666667, "other": 0}],views=[];
const number=v=>typeof v==='number'?v:Number(String(v).trim().replace(',','.'));
const fmt=v=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(v);
const time=v=>fmt(v)+' min';
function element(tag,text,cls){const d=document.createElement(tag);if(text!==undefined)d.textContent=text;if(cls)d.className=cls;return d;}
function stepper(input){
 const wrap=element('div',undefined,'quantity-stepper');
 const minus=element('button','−','btn'),plus=element('button','+','btn');
 minus.type=plus.type='button';minus.setAttribute('aria-label','Diminuir quantidade');plus.setAttribute('aria-label','Aumentar quantidade');
 for(const [button,delta] of [[minus,-1],[plus,1]])button.addEventListener('click',()=>{const current=Number(input.value),base=Number.isInteger(current)?current:0;input.value=Math.max(Number(input.min||0),Math.min(Number(input.max||10000),base+delta));input.dispatchEvent(new Event('input',{bubbles:true}));});
 wrap.append(minus,input,plus);return wrap;
}
function field(parent,label,value,min,max,step,onchange){const l=element('label',label,'form-label'),i=element('input',undefined,'form-control');i.type='text';i.inputMode='numeric';i.pattern='[0-9]*';i.autocomplete='off';i.value=value;i.min=min;i.max=max;i.step=step;i.addEventListener('input',()=>onchange(/^\d+$/.test(i.value)?Number(i.value):NaN));l.append(label.startsWith('Quantidade')?stepper(i):i);parent.append(l);return i;}
function calculate(data,settings,k){const cap=Math.round((settings.hours*60-settings.other)*1e6)/1e6,total=data.reduce((s,r)=>s+r.minutes*r.q[k],0),count=data.reduce((s,r)=>s+r.q[k],0);const loads=Array(6).fill(0),counts=Array(6).fill(0),demands=Array(6).fill(0);let done=0,used=0,unknown=false;const pending=[];
 const ordered=data.map((r,index)=>({...r,index})).sort((a,b)=>b.minutes-a.minutes);
 for(const r of ordered){let remaining=r.q[k];const idx=benchIndex(r.bench);if(idx>=0)demands[idx]+=r.minutes*remaining;else if(remaining)unknown=true;
 const assigned=idx>=0;
 if(assigned){const fitting=Math.max(0,Math.floor((cap-loads[idx]+1e-8)/r.minutes));const completed=Math.min(remaining,fitting);loads[idx]+=completed*r.minutes;counts[idx]+=completed;used+=completed*r.minutes;done+=completed;remaining-=completed;}
 if(remaining)pending.push({name:r.activity,bench:r.bench,q:remaining,time:remaining*r.minutes,reason:idx<0?'Bancada sem vínculo':'Capacidade da bancada esgotada'});}
 return {cap,total,count,loads,counts,demands,done,used,pending,needed:unknown?'Bancada sem vínculo':demands.reduce((s,v)=>s+Math.ceil(v/cap-1e-10),0)};}
function isValid(k){const s=settings[k];return Number.isInteger(s.people)&&s.people>=0&&s.people<=30&&Number.isFinite(s.hours)&&s.hours>0&&s.hours<=24&&Number.isFinite(s.other)&&s.other>=0&&s.other<s.hours*60&&rows.every(r=>Number.isInteger(r.q[k])&&r.q[k]>=0&&r.q[k]<=10000);}
function update(){get('cards').replaceChildren();settings.forEach((s,k)=>{const v=views[k];if(!isValid(k)){v.error.textContent='Revise equipe, jornada e quantidades. Outras atividades devem ocupar menos que o turno.';v.result.textContent='Cálculo indisponível';v.lanes.replaceChildren();v.pending.replaceChildren();return;}v.error.textContent='';const r=calculate(rows,s,k);
 const capacity=r.cap*s.people,percent=100*r.total/capacity;
 const card=element('div',undefined,'shift-card');if(percent>100)card.classList.add('alerta');card.append(element('div','Turno '+turnNames[k]+' · Carga / capacidade','label'),element('div',fmt(percent)+'%','value'),element('div','Carga programada '+time(r.total)+' · Capacidade '+time(capacity),'note'));get('cards').append(card);
 v.result.replaceChildren();const t=element('table',undefined,'table table-sm');const b=element('tbody');[
 ['Carga programada',time(r.total)],['Capacidade da equipe',time(r.cap*s.people)],['Carga / capacidade',s.people?fmt(100*r.total/(r.cap*s.people))+'%':r.total?'Sem equipe':'Sem demanda']
 ].forEach(([label,val])=>{const tr=element('tr');tr.append(element('th',label),element('td',val,'text-end tabular-nums'));b.append(tr);});t.append(b);v.result.append(t);
 v.lanes.replaceChildren();r.loads.forEach((load,i)=>{const line=element('div');const head=element('div',undefined,'lt-label text-small');head.append(element('span','Bancada '+benchNames[i]),element('span',time(r.demands[i])+' programados · Capacidade '+time(r.cap)));const track=element('div',undefined,'lt-track');track.setAttribute('role','img');track.setAttribute('aria-label','Bancada '+benchNames[i]+': '+time(r.demands[i])+' programados; Capacidade '+time(r.cap));const fill=element('div',undefined,'lt-fill');fill.style.width=Math.min(100,100*r.demands[i]/r.cap)+'%';track.append(fill);line.append(head,track);v.lanes.append(line);});
 v.pending.replaceChildren();
 });}
function build(){get('turns').replaceChildren();views.length=0;settings.forEach((s,k)=>{const section=element('section');section.append(element('h3','Turno '+turnNames[k]));const controls=element('div',undefined,'viz-controls');
 const [start,breakStart,breakEnd,end]=shiftTimes[k],effective=Math.round(s.hours*60),duration=String(Math.floor(effective/60)).padStart(2,'0')+':'+String(effective%60).padStart(2,'0');
 section.append(element('div','Trabalho: '+start+'–'+breakStart+' e '+breakEnd+'–'+end+' | Descanso: '+breakStart+'–'+breakEnd+' | Jornada efetiva: '+duration+' ('+time(effective)+')','text-small'));
 const teamLabel=element('label','Quantidade de analistas','form-label'),teamSelect=element('select',undefined,'form-control');
 for(let n=1;n<=(k===1?6:5);n++){const option=element('option',String(n));option.value=n;option.selected=n===s.people;teamSelect.append(option);}
 teamSelect.addEventListener('change',()=>{s.people=Number(teamSelect.value);update();});teamLabel.append(teamSelect);controls.append(teamLabel);section.append(controls);
 const error=element('div',undefined,'text-destructive');error.setAttribute('role','alert');const result=element('div');result.setAttribute('aria-live','polite');const lanes=element('div',undefined,'lt-lanes'),pending=element('div');section.append(error,result,lanes,pending);
 const editor=element('details');editor.append(element('summary','Quantidades por atividade — Turno '+turnNames[k]));editor.append(element('div','Toque no número para editar pelo teclado ou use os botões − e +. Se recebeu o arquivo por mensagem, abra-o no navegador para editar.','text-small'));
 const bulk=element('div',undefined,'viz-controls');let qty=1;const quantity=field(bulk,'Quantidade para todas as atividades',1,0,10000,1,v=>qty=v);const button=element('button','Aplicar a este turno','btn');button.type='button';const inputs=[];button.addEventListener('click',()=>{if(!Number.isInteger(qty)||qty<0||qty>10000){quantity.reportValidity();return;}rows.forEach((r,i)=>{r.q[k]=qty;inputs[i].value=qty;});update();});bulk.append(button);editor.append(bulk);
 let bench='';rows.forEach((r,index)=>{if(r.bench!==bench){bench=r.bench;editor.append(element('h3',bench));}const line=element('div',undefined,'lt-row');line.append(element('span',r.activity),element('span',time(r.minutes),'text-small'));const input=element('input',undefined,'form-control');input.type='text';input.inputMode='numeric';input.pattern='[0-9]*';input.autocomplete='off';input.value=r.q[k];input.min=0;input.max=10000;input.step=1;input.setAttribute('aria-label',r.bench+' '+r.activity+' quantidade no Turno '+turnNames[k]);input.addEventListener('input',()=>{r.q[k]=/^\d+$/.test(input.value)?Number(input.value):NaN;update();});inputs.push(input);line.append(stepper(input));editor.append(line);});section.append(editor);get('turns').append(section);views.push({error,result,lanes,pending});});
 get('data').replaceChildren();rows.forEach(r=>{const tr=element('tr');tr.append(element('td',r.bench),element('td',r.activity),element('td',fmt(r.minutes),'text-end'));get('data').append(tr);});update();}
function parseWorkbook(book){const sheet=book.Sheets[book.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});const normalize=x=>String(x??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const h=matrix[0]?.map(normalize)||[];const a=h.indexOf('bancada'),b=h.indexOf('atividade'),c=h.findIndex(x=>x.startsWith('tempo efetivo'));if([a,b,c].some(x=>x<0))throw Error('A primeira aba deve ter as colunas Bancada, Atividade e Tempo efetivo (min.).');
 const data=[];matrix.slice(1).forEach((row,i)=>{if(row.every(x=>x===null||String(x).trim()===''))return;const bench=String(row[a]??'').trim(),activity=String(row[b]??'').trim(),minutes=number(row[c]);if(!bench||!activity||row[c]===null||!Number.isFinite(minutes)||minutes<=0)throw Error('Linha '+(i+2)+': preencha bancada, atividade e tempo positivo em minutos.');data.push({bench,activity,minutes,q:benchIndex(bench)===5?[0,1,0]:[1,0,0]});});if(!data.length)throw Error('A planilha não contém atividades.');if(data.length>2000)throw Error('Use uma base com até 2.000 atividades.');return data;}
build();
})();
